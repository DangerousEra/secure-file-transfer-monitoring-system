{% extends 'base.html' %}{% block heading %}Security Policies{% endblock %}{% block content %}
<section class="panel"><div class="panel-title"><div><h2>Movement detection rules</h2><p>Rules classify activity as suspicious or a policy violation. They do not assert malicious intent.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#policyModal"><i class="bi bi-plus-lg"></i> New policy</button></div><div id="policyList" class="policy-list"></div></section>
<div class="modal fade" id="policyModal" tabindex="-1"><div class="modal-dialog modal-lg"><form class="modal-content modal-dark" id="policyForm"><div class="modal-header"><h5 class="modal-title">Create policy</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body row g-3"><div class="col-md-8"><label class="form-label">Policy name</label><input id="policyName" class="form-control" required maxlength="100"></div><div class="col-md-4"><label class="form-label">Severity</label><select id="policySeverity" class="form-select"><option>Medium</option><option>High</option><option>Critical</option><option>Low</option></select></div><div class="col-12"><label class="form-label">Description</label><input id="policyDescription" class="form-control" maxlength="1000"></div><div class="col-12"><label class="form-label">Sensitive source directory (optional)</label><input id="policySource" class="form-control" placeholder="C:\\safe-demo\\sensitive"></div><div class="col-md-6"><label class="form-label">Restricted destinations</label><input id="policyRestricted" class="form-control" placeholder="Comma-separated paths"></div><div class="col-md-6"><label class="form-label">Allowed destinations</label><input id="policyAllowed" class="form-control" placeholder="Comma-separated paths"></div><div class="col-12"><label class="form-label">File extensions</label><input id="policyExtensions" class="form-control" placeholder=".pdf, .xlsx, .env"></div></div><div class="modal-footer"><button class="btn btn-primary">Create policy</button></div></form></div></div>
{% endblock %}{% block scripts %}<script>document.addEventListener('DOMContentLoaded', SFTMS.loadPolicies)</script>{% endblock %}
