{% extends 'base.html' %}{% block heading %}Security Alerts{% endblock %}{% block content %}
<section class="panel"><div class="panel-title"><div><h2>Investigation queue</h2><p>Alerts indicate suspicious activity or policy violations that require review.</p></div></div><div class="filters"><select id="alertSeverity" class="form-select"><option value="">All severities</option><option>Informational</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select><select id="alertStatus" class="form-select"><option value="">All statuses</option><option>New</option><option>Investigating</option><option>Resolved</option><option>False Positive</option></select><button id="alertFilter" class="btn btn-primary">Filter</button></div><div class="table-responsive"><table class="table table-dark table-hover"><thead><tr><th>Time</th><th>Severity</th><th>Alert</th><th>Rule</th><th>Status</th><th>Action</th></tr></thead><tbody id="alertsTable"></tbody></table></div><div id="alertPagination" class="pagination-bar"></div></section>
<div class="modal fade" id="alertModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content modal-dark" id="alertForm"><div class="modal-header"><h5 class="modal-title">Update alert</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="alertId"><label class="form-label">Status</label><select id="alertNewStatus" class="form-select"><option>New</option><option>Investigating</option><option>Resolved</option><option>False Positive</option></select><label class="form-label mt-3">Investigation notes</label><textarea id="alertNotes" class="form-control" rows="4" maxlength="4000"></textarea></div><div class="modal-footer"><button class="btn btn-primary">Save update</button></div></form></div></div>
{% endblock %}{% block scripts %}<script>document.addEventListener('DOMContentLoaded', SFTMS.loadAlerts)</script>{% endblock %}
