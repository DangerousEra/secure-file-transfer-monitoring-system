services:
  - type: web
    name: secure-file-transfer-monitor-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SFTMS_SECRET_KEY
        generateValue: true
      - key: SFTMS_CLOUD_DEMO
        value: "true"
